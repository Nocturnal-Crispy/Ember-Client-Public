<!-- Delete Confirmation Modal -->
<div id="delete-confirm-modal" class="modal-overlay hidden">
  <div class="modal-container">
    <div class="modal-header">
      <h3 id="delete-modal-title">Delete Channel</h3>
    </div>
    <div class="modal-body">
      <p id="delete-modal-message">Are you sure? This cannot be undone.</p>
    </div>
    <div class="modal-footer">
      <button class="modal-btn modal-btn-secondary" id="delete-modal-cancel-btn">Cancel</button>
      <button class="modal-btn modal-btn-danger" id="delete-modal-confirm-btn">Delete</button>
    </div>
  </div>
</div>
