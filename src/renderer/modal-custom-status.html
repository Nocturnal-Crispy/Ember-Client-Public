<!-- Custom Status Modal -->
<div id="custom-status-modal" class="modal-overlay hidden">
  <div class="modal-container">
    <div class="modal-header">
      <h3>Set Custom Status</h3>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>PRESENCE</label>
        <select id="custom-status-presence" class="server-input custom-status-select">
          <option value="online">🟢 Online</option>
          <option value="idle">🟡 Away</option>
          <option value="dnd">🔴 Do Not Disturb</option>
          <option value="invisible">⚫ Invisible</option>
        </select>
      </div>
      <div class="form-group">
        <label>CUSTOM STATUS</label>
        <div class="custom-status-input-row">
          <button
            class="custom-status-emoji-btn"
            id="custom-status-emoji-btn"
            title="Choose emoji"
            aria-label="Choose emoji"
          >
            😊
          </button>
          <input
            type="text"
            id="custom-status-emoji-input"
            class="custom-status-emoji-input"
            maxlength="8"
            placeholder="😊"
            autocomplete="off"
            spellcheck="false"
          />
          <input
            type="text"
            id="custom-status-text-input"
            class="server-input custom-status-text-input"
            maxlength="100"
            placeholder="What are you up to?"
            autocomplete="off"
            spellcheck="false"
          />
        </div>
        <div class="custom-status-char-count"><span id="custom-status-char-count">0</span>/100</div>
      </div>
      <div class="error-message hidden" id="custom-status-error"></div>
    </div>
    <div class="modal-footer">
      <button class="modal-btn modal-btn-secondary" id="custom-status-clear-btn">
        CLEAR STATUS
      </button>
      <button class="modal-btn modal-btn-secondary" id="custom-status-cancel-btn">Cancel</button>
      <button class="modal-btn modal-btn-primary" id="custom-status-save-btn">Save</button>
    </div>
  </div>
</div>
