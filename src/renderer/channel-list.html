<!-- Channel List -->
<div class="channel-list">
  <div class="server-header" id="server-header">
    <h3></h3>
    <span class="dropdown-icon">▼</span>
    <div class="server-header-menu hidden" id="server-header-menu">
      <div class="server-header-menu-item" id="invite-people-btn">
        <span>Invite People</span>
      </div>
    </div>
  </div>

  <div class="channels"></div>

  <!-- Voice indicator (compact, shown when connected to a voice channel) -->
  <div class="voice-controls hidden" id="voice-controls">
    <span class="voice-channel-name"></span>
    <div class="voice-buttons">
      <button class="voice-btn voice-mute-btn" id="voice-mute-btn" title="Mute">🎤</button>
      <button class="voice-btn voice-deafen-btn" id="voice-deafen-btn" title="Deafen">🎧</button>
      <button class="voice-btn voice-camera-btn" id="voice-camera-btn" title="Start Camera">
        📷
      </button>
      <button
        class="voice-btn voice-screen-share-btn"
        id="voice-screen-share-btn"
        title="Share Screen"
      >
        🖥️
      </button>
      <button class="voice-btn voice-popout-btn" id="voice-popout-btn" title="Pop Out">⤢</button>
      <button class="voice-btn voice-disconnect-btn" id="voice-disconnect-btn" title="Disconnect">
        📵
      </button>
    </div>
  </div>

  <div class="user-panel">
    <div class="user-info" id="user-info">
      <div class="user-avatar-container">
        <div class="user-avatar">U</div>
        <span id="user-status-bubble" class="user-status-bubble status-online"></span>
      </div>
      <div class="user-details">
        <div class="username">User#0001</div>
        <div class="user-status" id="user-status-text">Online</div>
      </div>
    </div>
    <div class="user-menu hidden" id="user-menu">
      <div class="user-menu-item" id="menu-status">
        <span id="menu-status-bubble" class="status-bubble status-online"></span>
        <span>Status</span>
        <span class="menu-arrow">›</span>
        <div class="status-submenu hidden" id="status-submenu">
          <div class="status-option" data-status="Online">
            <span class="status-bubble status-online"></span>
            <span>Online</span>
          </div>
          <div class="status-option" data-status="Idle">
            <span class="status-bubble status-idle"></span>
            <span>Idle</span>
          </div>
          <div class="status-option" data-status="Do Not Disturb">
            <span class="status-bubble status-dnd"></span>
            <span>Do Not Disturb</span>
          </div>
          <div class="status-option" data-status="Invisible">
            <span class="status-bubble status-offline"></span>
            <span>Invisible</span>
          </div>
          <div class="status-submenu-separator"></div>
          <div class="status-option" id="set-custom-status-btn">
            <span class="status-custom-icon">✏️</span>
            <span>Set Custom Status</span>
          </div>
        </div>
      </div>
      <div class="user-menu-item" id="menu-edit-profile">
        <span>✏️</span>
        <span>Edit Profile</span>
      </div>
      <div class="user-menu-separator"></div>
      <div class="user-menu-item danger" id="menu-logout">
        <span>🚪</span>
        <span>Logout</span>
      </div>
    </div>
  </div>
</div>
