<!-- GIF Picker Panel -->
<div class="gif-picker-panel hidden" id="gif-picker-panel" role="dialog" aria-label="GIF picker">
  <div class="gif-picker-search">
    <input
      type="text"
      class="gif-picker-search-input"
      id="gif-picker-search-input"
      placeholder="Search GIFs..."
      autocomplete="off"
    />
  </div>
  <div class="gif-picker-grid" id="gif-picker-grid">
    <div class="gif-picker-empty" id="gif-picker-empty">Search for GIFs above</div>
  </div>
  <div class="gif-picker-footer">
    <span class="gif-picker-attribution">Powered by Giphy</span>
  </div>
</div>
