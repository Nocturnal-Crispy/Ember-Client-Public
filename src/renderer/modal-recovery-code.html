<!-- Recovery Code Modal -->
<div id="recovery-code-modal" class="loading-overlay hidden">
  <div class="login-card" style="max-width: 440px; text-align: center">
    <div class="login-header">
      <h1 style="color: #faa61a; font-size: 1.3rem">Save Your Recovery Code</h1>
      <p style="color: #b9bbbe; font-size: 0.85rem; margin-top: 8px; line-height: 1.5">
        This code is required to log in from a new device. Store it somewhere safe. You will
        <strong style="color: #fff">not</strong> see it again.
      </p>
    </div>
    <div
      id="recovery-code-display"
      style="
        background: #202225;
        border-radius: 8px;
        padding: 18px;
        margin: 16px 0;
        font-family: 'Courier New', monospace;
        font-size: 1.6rem;
        letter-spacing: 3px;
        color: #fff;
        user-select: all;
        border: 1px solid #faa61a33;
      "
    ></div>
    <button
      type="button"
      id="recovery-code-copy-btn"
      style="
        background: #4f545c;
        color: #fff;
        border: none;
        border-radius: 4px;
        padding: 8px 16px;
        cursor: pointer;
        font-size: 0.85rem;
        margin-bottom: 12px;
      "
    >
      Copy to Clipboard
    </button>
    <button
      type="button"
      id="recovery-code-continue-btn"
      class="submit-btn"
      style="margin-top: 8px"
    >
      I've Saved My Code
    </button>
  </div>
</div>
