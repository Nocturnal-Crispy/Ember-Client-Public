<!-- Main Chat Area -->
<div class="chat-container" id="chat-container" style="display: none">
  <div class="chat-header">
    <span class="channel-icon">#</span>
    <span class="channel-title"></span>
    <div class="chat-header-divider"></div>
    <span class="channel-description"></span>
  <!--  <button id="toggle-members-btn" class="header-icon-btn" title="Toggle Member List">
    <span class="icon">👥</span>
  </button> -->
  </div>

  <div id="video-grid" class="video-grid" style="display: none">
    <div id="video-focus-area" class="video-focus-area"></div>
    <div id="video-strip" class="video-strip"></div>
    <div id="video-audio-only-bar" class="video-audio-only-bar"></div>
  </div>

  <div class="messages-container" id="messages"></div>

  <div class="message-input-container">
    <input type="file" id="attachment-file-input" style="display: none" />
    <div id="attachment-preview" class="attachment-preview hidden"></div>
    <div class="message-input-wrapper">
      <textarea class="message-input" placeholder="Message" id="messageInput" rows="1"></textarea>
      <div class="input-actions">
        <button class="send-btn" id="send-btn" title="Send Message">&#9654;</button>
        <button class="attachment-btn" id="attachment-btn" title="Add Attachment">+</button>
        <button class="input-action-btn" id="emoji-btn" title="Add Emoji">😊</button>
        <button class="input-action-btn" id="gif-btn" title="Add GIF">GIF</button>
      </div>
    </div>
  </div>
</div>
