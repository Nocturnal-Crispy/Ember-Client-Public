<!-- User Details Modal -->
<div id="user-details-modal" class="modal-overlay hidden user-details-overlay" aria-modal="true" role="dialog" aria-labelledby="user-details-username">
  <div class="user-details-container" id="user-details-container">
    <button class="user-details-close" id="user-details-close" aria-label="Close user details">✕</button>

    <div class="user-details-header">
      <div class="user-details-avatar" id="user-details-avatar" aria-hidden="true"></div>
      <div class="user-details-identity">
        <div class="user-details-username" id="user-details-username"></div>
        <div class="user-details-status-row">
          <span class="user-details-status-dot" aria-hidden="true"></span>
          <span class="user-details-status" id="user-details-status"></span>
        </div>
      </div>
    </div>

    <div class="user-details-role" id="user-details-role"></div>

    <div class="user-details-custom-status hidden" id="user-details-custom-status"></div>

    <div class="user-details-voice hidden" id="user-details-voice"></div>

    <div class="user-details-actions">
      <button class="user-details-dm-btn" id="user-details-dm-btn">Send Message</button>
    </div>
  </div>
</div>
