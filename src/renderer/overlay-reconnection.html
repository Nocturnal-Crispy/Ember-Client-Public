<!-- Reconnection Overlay -->
<div id="reconnection-overlay" class="reconnection-overlay hidden">
  <div class="reconnection-container">
    <img src="assets/icons/Ember_Loading.gif" class="reconnection-loading-gif" alt="Loading">
    <h2 class="reconnection-title">Connection Lost</h2>
    <p class="reconnection-message">Attempting to reconnect to server...</p>
    <p class="reconnection-timer" id="reconnection-timer">Time remaining: 60s</p>
    <button class="reconnection-disconnect-btn" id="reconnection-disconnect-btn">Disconnect Now</button>
  </div>
</div>
