<!-- TOTP 2FA Setup Modal -->
<div id="totp-setup-modal" class="modal-overlay hidden">
  <div class="modal-content" style="max-width: 480px; max-height: 90vh; text-align: center; display: flex; flex-direction: column">
    <div class="modal-header">
      <h2 style="color: #fff; font-size: 1.2rem">Set Up Two-Factor Authentication</h2>
      <button type="button" class="modal-close-btn" id="totp-setup-close">&times;</button>
    </div>
    <div class="modal-body" style="padding: 16px; overflow-y: auto; flex: 1">
      <!-- Step 1: QR Code -->
      <div id="totp-setup-step-qr">
        <p style="color: #b9bbbe; font-size: 0.85rem; margin-bottom: 16px">
          Scan this QR code with Google Authenticator or another TOTP app.
        </p>
        <div id="totp-setup-qr" style="margin: 16px auto; display: flex; justify-content: center"></div>
        <p style="color: #72767d; font-size: 0.75rem; margin: 8px 0">Or enter this key manually:</p>
        <div
          id="totp-setup-secret"
          style="background: #202225; border-radius: 6px; padding: 10px; font-family: 'Courier New', monospace; font-size: 0.9rem; color: #fff; user-select: all; margin-bottom: 16px; word-break: break-all"
        ></div>
        <div style="margin: 16px 0">
          <label style="color: #b9bbbe; font-size: 0.85rem; display: block; margin-bottom: 8px"
            >Enter the 6-digit code to verify:</label
          >
          <input
            type="text"
            id="totp-setup-code"
            class="form-input"
            placeholder="000000"
            maxlength="6"
            autocomplete="one-time-code"
            inputmode="numeric"
            style="text-align: center; font-size: 1.2rem; letter-spacing: 4px; font-family: 'Courier New', monospace"
          />
        </div>
        <p
          id="totp-setup-error"
          style="color: #f04747; font-size: 0.8rem; margin-bottom: 8px; display: none"
        ></p>
        <button type="button" id="totp-setup-verify-btn" class="submit-btn" style="width: 100%">
          Verify &amp; Enable
        </button>
      </div>
      <!-- Step 2: Backup Codes -->
      <div id="totp-setup-step-backup" style="display: none">
        <p style="color: #faa61a; font-size: 0.9rem; font-weight: 600; margin-bottom: 8px">
          Save Your Backup Codes
        </p>
        <p style="color: #b9bbbe; font-size: 0.8rem; margin-bottom: 16px">
          Store these codes somewhere safe. Each can be used once if you lose access to your
          authenticator app.
        </p>
        <div
          id="totp-setup-backup-codes"
          style="background: #202225; border-radius: 8px; padding: 16px; font-family: 'Courier New', monospace; font-size: 1rem; color: #fff; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px"
        ></div>
        <button
          type="button"
          id="totp-setup-copy-backup"
          style="background: #4f545c; color: #fff; border: none; border-radius: 4px; padding: 8px 16px; cursor: pointer; font-size: 0.85rem; margin-bottom: 12px"
        >
          Copy All Codes
        </button>
        <button type="button" id="totp-setup-done-btn" class="submit-btn" style="width: 100%">
          I've Saved My Codes
        </button>
      </div>
    </div>
  </div>
</div>
