<div id="image-viewer-modal" class="image-viewer-overlay hidden">
  <div class="image-viewer-toolbar">
    <span id="image-viewer-name" class="image-viewer-name"></span>
    <div class="image-viewer-controls">
      <button class="image-viewer-btn" id="image-viewer-zoom-out" title="Zoom out">−</button>
      <span class="image-viewer-zoom-label" id="image-viewer-zoom-label">100%</span>
      <button class="image-viewer-btn" id="image-viewer-zoom-in" title="Zoom in">+</button>
      <button class="image-viewer-btn" id="image-viewer-reset" title="Reset zoom">[ ]</button>
      <button class="image-viewer-btn image-viewer-close" id="image-viewer-close" title="Close">×</button>
    </div>
  </div>
  <div class="image-viewer-stage" id="image-viewer-stage">
    <img class="image-viewer-img" id="image-viewer-img" alt="">
  </div>
</div>
