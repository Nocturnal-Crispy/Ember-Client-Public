<!-- Join Server Modal -->
<div id="join-server-modal" class="modal-overlay hidden">
  <div class="modal-container invite-modal-container">
    <div class="modal-header">
      <img src="assets/icons/ember_1024x1024.png" class="invite-emblem" alt="Ember" />
      <h3>Join a Server</h3>
    </div>
    <div class="modal-body invite-modal-body">
      <div class="form-group">
        <label for="join-invite-input">Invite Link</label>
        <input
          type="text"
          id="join-invite-input"
          class="server-input"
          placeholder="https://ember-chat.com/invite/abc123"
        />
        <p class="join-hint">Paste an invite link to join a server</p>
      </div>
      <div class="error-message hidden" id="join-server-error"></div>
    </div>
    <div class="modal-footer">
      <button class="modal-btn modal-btn-secondary" id="join-server-cancel-btn">Cancel</button>
      <button class="modal-btn modal-btn-primary" id="join-server-btn">Join</button>
    </div>
  </div>
</div>
