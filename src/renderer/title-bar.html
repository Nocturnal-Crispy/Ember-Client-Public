<!-- Custom Title Bar -->
<div class="title-bar">
  <div class="title-bar-drag-region"></div>
  <div class="title-bar-title">ember</div>
  <div class="title-bar-drag-region"></div>
  <div class="window-controls">
    <button class="window-control minimize" id="minimize-btn">
      <svg width="12" height="12" viewBox="0 0 12 12">
        <rect fill="currentColor" width="10" height="1" x="1" y="6"/>
      </svg>
    </button>
    <button class="window-control maximize" id="maximize-btn">
      <svg width="12" height="12" viewBox="0 0 12 12">
        <rect fill="currentColor" width="9" height="9" x="1.5" y="1.5" stroke="currentColor" stroke-width="1" fill="none"/>
      </svg>
    </button>
    <button class="window-control close" id="close-btn">
      <svg width="12" height="12" viewBox="0 0 12 12">
        <path fill="currentColor" d="M6.8,6l3.6-3.6L9.6,1.6L6,5.2L2.4,1.6L1.6,2.4L5.2,6L1.6,9.6l0.8,0.8L6,6.8l3.6,3.6l0.8-0.8L6.8,6z"/>
      </svg>
    </button>
  </div>
</div>
