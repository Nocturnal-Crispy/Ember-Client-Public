<!-- Attachment options modal -->

  <div class="modal-container attachment-modal-container">
    <div class="modal-header">
      <h3>Add Attachment</h3>
      <button class="modal-close-x" id="attachment-modal-close" aria-label="Close">×</button>

    <div class="modal-body attachment-modal-body">
      <button class="attachment-option-btn" id="upload-file-btn">

      </button>
    </div>
  </div>
</div>
