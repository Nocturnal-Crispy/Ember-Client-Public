<!-- External Link Confirmation Modal -->
<div id="external-link-modal" class="modal-overlay hidden">
  <div class="modal-container external-link-modal-container">
    <div class="modal-header external-link-modal-header">
      <svg class="external-link-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
        <polyline points="15 3 21 3 21 9"/>
        <line x1="10" y1="14" x2="21" y2="3"/>
      </svg>
      <h3>Open External Link</h3>
    </div>
    <div class="modal-body external-link-modal-body">
      <p class="external-link-warning">This will open a link outside of Ember:</p>
      <div class="external-link-url-box">
        <span id="external-link-url" class="external-link-url-text"></span>
      </div>
    </div>
    <div class="modal-footer">
      <button id="external-link-cancel" class="modal-btn modal-btn-secondary">Cancel</button>
      <button id="external-link-open" class="modal-btn modal-btn-primary">Open in Browser</button>
    </div>
  </div>
</div>
