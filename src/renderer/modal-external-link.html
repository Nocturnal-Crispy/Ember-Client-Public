<!-- External Link Confirmation Modal -->
<div id="external-link-modal" class="modal-overlay hidden">
  <div class="modal-container external-link-modal-container">
    <div class="modal-title">Open External Link</div>
    <div class="modal-body external-link-modal-body">
      <p class="external-link-warning">You are about to leave the application and open:</p>
      <div class="external-link-url-box">
        <span id="external-link-url" class="external-link-url-text"></span>
      </div>
    </div>
    <div class="modal-actions">
      <button id="external-link-cancel" class="modal-btn modal-btn-secondary">Cancel</button>
      <button id="external-link-open" class="modal-btn modal-btn-primary">Open in Browser</button>
    </div>
  </div>
</div>
