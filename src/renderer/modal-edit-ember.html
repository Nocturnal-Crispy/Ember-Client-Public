<!-- Edit Ember Modal -->
<div id="edit-ember-modal" class="modal-overlay hidden">
  <div class="modal-container create-server-container">
    <div class="modal-header">
      <h3>Edit Server</h3>
    </div>
    <div class="modal-body create-server-body">
      <div class="form-group">
        <label for="edit-ember-name-input">Server Name</label>
        <input
          type="text"
          id="edit-ember-name-input"
          class="server-input"
          placeholder="Enter server name"
          maxlength="100"
          required
        />
      </div>

      <div class="form-group">
        <label>Server Icon (Optional)</label>
        <div class="icon-source-toggle">
          <button class="icon-toggle-btn active" data-source="upload">Upload Image</button>
          <button class="icon-toggle-btn" data-source="url">Use URL</button>
        </div>
      </div>

      <div class="icon-input-container">
        <div class="icon-input-section" id="edit-upload-section">
          <input
            type="file"
            id="edit-ember-icon-upload"
            accept="image/png,image/jpeg,image/jpg,image/gif,image/webp"
            style="display: none"
          />
          <button class="upload-icon-btn" id="edit-upload-icon-btn">
            <span>Choose Image</span>
          </button>
          <p class="icon-hint">Recommended: 512x512 pixels</p>
        </div>

        <div class="icon-input-section hidden" id="edit-url-section">
          <input
            type="text"
            id="edit-ember-icon-url"
            class="server-input"
            placeholder="https://example.com/icon.png"
          />
          <button class="load-url-btn" id="edit-load-url-btn">Load Preview</button>
        </div>
      </div>

      <div class="icon-preview-container" id="edit-icon-preview-container">
        <div class="icon-preview" id="edit-icon-preview">
          <span class="preview-placeholder">No icon selected</span>
        </div>
        <button class="remove-icon-btn hidden" id="edit-remove-icon-btn">Remove Icon</button>
      </div>

      <div class="error-message hidden" id="edit-ember-error"></div>
    </div>
    <div class="modal-footer">
      <button class="modal-btn modal-btn-secondary" id="edit-ember-cancel-btn">Cancel</button>
      <button class="modal-btn modal-btn-primary" id="edit-ember-save-btn">Save Changes</button>
    </div>
  </div>
</div>
