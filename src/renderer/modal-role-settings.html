<!-- Role Settings Modal -->
<div id="role-settings-modal" class="modal-overlay hidden">
  <div class="modal-container" style="width: 680px; max-height: 80vh; display: flex; flex-direction: column;">
    <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center;">
      <h3 id="role-settings-title">Server Settings</h3>
      <button class="modal-close-btn" id="role-settings-close-btn" style="background: none; border: none; color: var(--text-secondary); font-size: 1.2rem; cursor: pointer;">&times;</button>
    </div>

    <div class="modal-body" style="flex: 1; overflow-y: auto; padding: 0;">
      <!-- Tab navigation -->
      <div style="display: flex; border-bottom: 1px solid var(--border-color, #2a2a2a); padding: 0 16px;">
        <button class="role-tab active" data-tab="roles" style="background: none; border: none; border-bottom: 2px solid var(--accent-color, #5865f2); color: var(--text-primary); padding: 10px 16px; cursor: pointer; font-size: 0.9rem;">Roles</button>
        <button class="role-tab" data-tab="members" style="background: none; border: none; border-bottom: 2px solid transparent; color: var(--text-secondary); padding: 10px 16px; cursor: pointer; font-size: 0.9rem;">Members</button>
      </div>

      <!-- Roles Tab -->
      <div id="role-tab-roles" class="role-tab-content" style="padding: 16px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <span style="color: var(--text-secondary); font-size: 0.85rem;">Manage roles and their permissions</span>
          <button id="role-create-btn" class="modal-btn modal-btn-primary" style="padding: 6px 14px; font-size: 0.85rem;">+ New Role</button>
        </div>

        <!-- Role list -->
        <div id="role-list" style="margin-bottom: 16px;"></div>

        <!-- Role editor (shown when a role is selected) -->
        <div id="role-editor" style="display: none; border: 1px solid var(--border-color, #2a2a2a); border-radius: 6px; padding: 16px;">
          <div style="display: flex; gap: 12px; margin-bottom: 16px;">
            <div style="flex: 1;">
              <label style="display: block; color: var(--text-secondary); font-size: 0.8rem; margin-bottom: 4px;">Role Name</label>
              <input type="text" id="role-name-input" style="width: 100%; background: var(--input-bg, #1a1a1a); border: 1px solid var(--border-color, #2a2a2a); border-radius: 4px; color: var(--text-primary); padding: 8px; font-size: 0.9rem;" maxlength="100" />
            </div>
            <div>
              <label style="display: block; color: var(--text-secondary); font-size: 0.8rem; margin-bottom: 4px;">Color</label>
              <input type="color" id="role-color-input" value="#5865f2" style="width: 40px; height: 34px; border: none; cursor: pointer; background: transparent;" />
            </div>
          </div>

          <div style="color: var(--text-secondary); font-size: 0.8rem; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;">Permissions</div>
          <div id="role-permissions-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px; max-height: 300px; overflow-y: auto;"></div>

          <div style="display: flex; justify-content: space-between; margin-top: 16px;">
            <button id="role-delete-btn" class="modal-btn" style="background: var(--danger-color, #ed4245); color: white; padding: 6px 14px; font-size: 0.85rem;">Delete Role</button>
            <div style="display: flex; gap: 8px;">
              <button id="role-cancel-edit-btn" class="modal-btn modal-btn-secondary" style="padding: 6px 14px; font-size: 0.85rem;">Cancel</button>
              <button id="role-save-btn" class="modal-btn modal-btn-primary" style="padding: 6px 14px; font-size: 0.85rem;">Save</button>
            </div>
          </div>
        </div>

        <div class="error-message hidden" id="role-settings-error" style="margin-top: 8px;"></div>
      </div>

      <!-- Members Tab -->
      <div id="role-tab-members" class="role-tab-content" style="display: none; padding: 16px;">
        <div style="color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 12px;">Assign roles to members</div>
        <div id="role-member-list"></div>
      </div>
    </div>
  </div>
</div>
