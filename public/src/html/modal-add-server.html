<!-- Add Server Chooser Modal -->
<div id="add-server-modal" class="modal-overlay hidden">
  <div class="modal-container invite-modal-container">
    <div class="modal-header">
      <h3>Add a Server</h3>
    </div>
    <div class="modal-body" style="padding: 16px 0;">
      <button class="add-server-option" id="add-server-create-btn">
        <span class="add-server-option-icon">🔥</span>
        <span class="add-server-option-text">Create My Own</span>
      </button>
      <button class="add-server-option" id="add-server-join-btn">
        <span class="add-server-option-icon">🔗</span>
        <span class="add-server-option-text">Join a Server</span>
      </button>
    </div>
    <div class="modal-footer">
      <button class="modal-btn modal-btn-secondary" id="add-server-cancel-btn">Cancel</button>
    </div>
  </div>
</div>
