<!-- Accept Invite Modal -->
<div id="accept-invite-modal" class="modal-overlay hidden">
  <div class="modal-container invite-modal-container">
    <div class="modal-header">
      <h3 id="accept-invite-title">Join Server</h3>
    </div>
    <div class="modal-body invite-modal-body">
      <div class="accept-invite-info">
        <div class="accept-invite-icon" id="accept-invite-icon"></div>
        <div class="accept-invite-name" id="accept-invite-name"></div>
        <div class="accept-invite-members" id="accept-invite-members"></div>
      </div>
      <div class="error-message hidden" id="accept-invite-error"></div>
    </div>
    <div class="modal-footer">
      <button class="modal-btn modal-btn-secondary" id="accept-invite-cancel-btn">Cancel</button>
      <button class="modal-btn modal-btn-primary" id="accept-invite-join-btn">Join Server</button>
    </div>
  </div>
</div>
