<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ember - Login</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="title-bar">
    <div class="title-bar-drag-region"></div>
    <div class="title-bar-title">Ember</div>
    <div class="title-bar-drag-region"></div>
    <div class="window-controls">
      <button class="window-control minimize" id="minimize-btn">
        <svg width="12" height="12" viewBox="0 0 12 12">
          <rect fill="currentColor" width="10" height="1" x="1" y="6"/>
        </svg>
      </button>
      <button class="window-control maximize" id="maximize-btn">
        <svg width="12" height="12" viewBox="0 0 12 12">
          <rect fill="currentColor" width="9" height="9" x="1.5" y="1.5" stroke="currentColor" stroke-width="1" fill="none"/>
        </svg>
      </button>
      <button class="window-control close" id="close-btn">
        <svg width="12" height="12" viewBox="0 0 12 12">
          <path fill="currentColor" d="M6.8,6l3.6-3.6L9.6,1.6L6,5.2L2.4,1.6L1.6,2.4L5.2,6L1.6,9.6l0.8,0.8L6,6.8l3.6,3.6l0.8-0.8L6.8,6z"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1 id="form-title">Welcome to Ember</h1>
        <p id="form-subtitle">Login to continue</p>
      </div>

      <div id="error-banner" class="error-banner hidden"></div>

      <form id="auth-form" class="auth-form">
        <div class="form-group">
          <label for="hostname">Server Hostname</label>
          <input 
            type="text" 
            id="hostname" 
            name="hostname" 
            placeholder="http://localhost:8080"
            required
          >
          <span class="error-message" id="hostname-error"></span>
        </div>

        <div class="form-group">
          <label for="username">Username</label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            placeholder="Enter your username"
            required
            autocomplete="username"
          >
          <span class="error-message" id="username-error"></span>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-input-wrapper">
            <input 
              type="password" 
              id="password" 
              name="password" 
              placeholder="Enter your password"
              required
              autocomplete="current-password"
            >
            <button type="button" class="password-toggle" id="password-toggle">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <span class="error-message" id="password-error"></span>
        </div>

        <div class="form-group" id="confirm-password-group" style="display: none;">
          <label for="confirm-password">Confirm Password</label>
          <div class="password-input-wrapper">
            <input 
              type="password" 
              id="confirm-password" 
              name="confirm-password" 
              placeholder="Confirm your password"
              autocomplete="new-password"
            >
            <button type="button" class="password-toggle" id="confirm-password-toggle">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <span class="error-message" id="confirm-password-error"></span>
        </div>

        <button type="submit" class="submit-btn" id="submit-btn">
          <span id="submit-btn-text">Login</span>
        </button>
      </form>

      <div class="form-footer">
        <span id="toggle-text">Need an account?</span>
        <button type="button" class="link-btn" id="toggle-mode">Register</button>
      </div>
    </div>
  </div>

  <div id="recovery-code-modal" class="loading-overlay hidden">
    <div class="login-card" style="max-width: 440px; text-align: center;">
      <div class="login-header">
        <h1 style="color: #faa61a; font-size: 1.3rem;">Save Your Recovery Code</h1>
        <p style="color: #b9bbbe; font-size: 0.85rem; margin-top: 8px; line-height: 1.5;">
          This code is required to log in from a new device. Store it somewhere safe. You will <strong style="color: #fff;">not</strong> see it again.
        </p>
      </div>
      <div id="recovery-code-display" style="background: #202225; border-radius: 8px; padding: 18px; margin: 16px 0; font-family: 'Courier New', monospace; font-size: 1.6rem; letter-spacing: 3px; color: #fff; user-select: all; border: 1px solid #faa61a33;"></div>
      <button type="button" id="recovery-code-copy-btn" style="background: #4f545c; color: #fff; border: none; border-radius: 4px; padding: 8px 16px; cursor: pointer; font-size: 0.85rem; margin-bottom: 12px;">Copy to Clipboard</button>
      <button type="button" id="recovery-code-continue-btn" class="submit-btn" style="margin-top: 8px;">I've Saved My Code</button>
    </div>
  </div>

  <div id="loading-overlay" class="loading-overlay hidden">
    <div class="loading-content">
      <img src="Icons/Ember_Loading.gif" class="loading-gif" alt="Loading">
      <p class="loading-text" id="loading-text">Connecting to server...</p>
      <p class="loading-subtext" id="loading-subtext"></p>
    </div>
  </div>

  <script src="logger.js"></script>
  <script src="auth.js"></script>
</body>
</html>
