<!DOCTYPE html>
<html>
<head>
    <title>Test SignalSessionManager Fix</title>
</head>
<body>
    <h1>Testing SignalSessionManager Fix</h1>
    <div id="output"></div>
    
    <script>
        const output = document.getElementById('output');
        
        function log(message) {
            console.log(message);
            output.innerHTML += message + '<br>';
        }
        
        // Mock the required globals
        window.electronAPI = {
            ipc: {
                invoke: () => Promise.resolve(),
                on: () => {},
                removeAllListeners: () => {}
            }
        };
        
        window.getAuthSync = () => ({
            token: 'test-token',
            hostname: 'https://test.example.com',
            user_id: 'test-user-id',
            device_id: 'test-device-id',
            username: 'testuser'
        });
        
        // Mock SignalService
        window.SignalService = class MockSignalService {
            constructor(auth) {
                log('✅ MockSignalService instantiated');
            }
        };
        
        async function testSignalSessionManager() {
            try {
                log('Testing SignalSessionManager instantiation...');
                
                // Load the script
                const script = document.createElement('script');
                script.src = './dist/renderer/managers/signal-session-manager.js';
                script.onload = () => {
                    log('✅ SignalSessionManager script loaded');
                    
                    // Test if SignalSessionManager is available globally
                    if (typeof window.SignalSessionManager !== 'undefined') {
                        log('✅ SignalSessionManager available globally');
                        
                        // Test instantiation
                        const auth = window.getAuthSync();
                        const manager = new window.SignalSessionManager(auth);
                        log('✅ SignalSessionManager instantiated successfully');
                        log('✅ All tests passed!');
                    } else {
                        log('❌ SignalSessionManager not available globally');
                    }
                };
                script.onerror = (error) => {
                    log('❌ Failed to load SignalSessionManager script: ' + error);
                };
                document.head.appendChild(script);
                
            } catch (error) {
                log('❌ Error: ' + error.message);
                console.error(error);
            }
        }
        
        // Run the test
        testSignalSessionManager();
    </script>
</body>
</html>
